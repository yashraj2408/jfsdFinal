<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - JFSD Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            overflow: hidden;
            color: #333;
            position: relative;
        }

        .droplet {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            animation: moveDroplet 8s ease-in-out infinite;
            opacity: 0.5;
        }

        @keyframes moveDroplet {
            0% { transform: translateY(0px); }
            50% { transform: translateY(15px); opacity: 0.7; }
            100% { transform: translateY(0px); }
        }

        form {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: left;
            z-index: 1;
            animation: popIn 0.8s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h2 {
            font-size: 1.8em;
            color: #1e3c72;
            margin-bottom: 0.6em;
            font-weight: 800;
            text-align: center;
        }

        label {
            font-size: 0.9em;
            font-weight: 600;
            color: #475569;
            margin-top: 14px;
            display: block;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 13px;
            margin-top: 20px;
            font-size: 1.05em;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            margin-top: 14px;
            font-size: 0.88em;
            border: 1px solid #fecaca;
            text-align: center;
        }

        .quick-fill {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            text-align: center;
        }

        .quick-fill span {
            display: block;
            font-size: 0.8em;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .btn-quick {
            padding: 6px 12px;
            margin: 0 4px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
            color: #1e3c72;
            cursor: pointer;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 0.88em;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script>
        const createDroplets = () => {
            const numDroplets = 12;
            for (let i = 0; i < numDroplets; i++) {
                const droplet = document.createElement("div");
                droplet.classList.add("droplet");
                droplet.style.width = `${6 + Math.random() * 18}px`;
                droplet.style.height = droplet.style.width;
                droplet.style.left = `${Math.random() * 100}vw`;
                droplet.style.top = `${Math.random() * 100}vh`;
                droplet.style.animationDuration = `${6 + Math.random() * 6}s`;
                document.body.appendChild(droplet);
            }
        };
        createDroplets();

        function fillDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }
    </script>

    <form action="#" th:action="@{/login}" method="post">
        <h2>Sign In</h2>
        
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="e.g. admin@gmail.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit">Sign In</button>
        
        <div class="error" th:if="${error}" th:text="${error}"></div>
        
        <div class="quick-fill">
            <span>⚡ Quick-Fill Demo Credentials:</span>
            <button type="button" class="btn-quick" onclick="fillDemo('admin@gmail.com', 'admin123')">🔑 Admin</button>
            <button type="button" class="btn-quick" onclick="fillDemo('user@gmail.com', 'user123')">👤 Customer</button>
        </div>

        <div class="links">
            <a href="/signup">➕ Create New Account</a>
            <a href="/">← Back to Home</a>
        </div>
    </form>
</body>
</html>
