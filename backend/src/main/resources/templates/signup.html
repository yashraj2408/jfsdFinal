<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account - JFSD Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            padding: 20px;
        }

        form {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            text-align: left;
            z-index: 1;
        }

        h2 {
            font-size: 1.8em;
            color: #1e3c72;
            margin-bottom: 0.6em;
            font-weight: 800;
            text-align: center;
        }

        label {
            font-size: 0.88em;
            font-weight: 600;
            color: #475569;
            margin-top: 12px;
            display: block;
        }

        input[type="email"], input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 11px 12px;
            margin-top: 6px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 13px;
            margin-top: 22px;
            font-size: 1.05em;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            margin-top: 14px;
            font-size: 0.88em;
            border: 1px solid #fecaca;
            text-align: center;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 0.88em;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form action="#" th:action="@{/signup}" method="post">
        <h2>Create New Account</h2>

        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. johndoe (optional)">

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required>

        <label for="password">Password *</label>
        <input type="password" id="password" name="password" placeholder="Create a secure password" required>

        <label for="role">Account Role</label>
        <select id="role" name="role">
            <option value="USER" selected>Customer (USER)</option>
            <option value="ADMIN">Administrator (ADMIN)</option>
        </select>

        <button type="submit">Sign Up</button>

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <div class="links">
            <a href="/login">Already have an account? Sign in</a>
            <a href="/">← Home</a>
        </div>
    </form>
</body>
</html>
