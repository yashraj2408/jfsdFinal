# Server Port (Auto-detects cloud PORT environment variable, defaults to 8080)
server.port=${PORT:8080}

# Application Name
spring.application.name=fbs13

# Database Configuration
# Default: H2 embedded database (zero configuration, works out of the box on Render and laptop!)
# Override with environment variable SPRING_DATASOURCE_URL if using MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./db/fbs13db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
